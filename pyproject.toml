[project]
name = "bookflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.139.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "requests>=2.34.2",
    "ruff>=0.16.3",
    "sqlalchemy>=2.0.51",
    "taskipy>=1.14.1",
    "tzdata>=2026.3",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.taskipy.tasks]
lint = 'ruff check'
lint_fix = 'ruff check --fix'
format = 'ruff format'
run = 'uv run fastapi dev'
makemigrations = 'alembic revision --autogenerate -m'
migrate = 'alembic upgrade head'

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
